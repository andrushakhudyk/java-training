spring.application.name=demo

# URL указывает на localhost, стандартный порт 5432 и базу данных по умолчанию (postgres)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=1908

# Hibernate автоматически подберет нужный диалект SQL, но можно указать явно:
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Управление схемой (обновляет таблицы на основе ваших @Entity при запуске)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true